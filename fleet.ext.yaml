schema: 1
id: org.fleet.nfo
name: NFO
description: Find and display release NFO files.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - storage.read
  - storage.write
  - torrents.read
  - files.read
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/nfo-worker
  protocol: jsonrpc-2
